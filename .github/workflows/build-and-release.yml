name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Plugin
        run: |
          mkdir omnimind-plugin
          cp -r dist omnimind-plugin/
          cp package.json omnimind-plugin/
          cp manifest.json omnimind-plugin/
          cp README.md omnimind-plugin/ || true
          cp LICENSE omnimind-plugin/ || true
          zip -r omnimind-${{ github.ref_name }}.zip omnimind-plugin
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnimind-plugin
          path: omnimind-${{ github.ref_name }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: omnimind-plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: omnimind-${{ github.ref_name }}.zip
          generate_release_notes: true
